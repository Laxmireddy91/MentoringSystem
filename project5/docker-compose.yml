version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: mentorconnect-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=mentorconnect
    volumes:
      - mongo_data:/data/db
    networks:
      - mentorconnect-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API & Socket.IO Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentorconnect-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/mentorconnect}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mentorconnect-network

  # React Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentorconnect-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - mentorconnect-network

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  mentorconnect-network:
    driver: bridge
